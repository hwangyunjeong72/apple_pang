<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>사과팡</title>


<style>

/* ==================================================
   기본 설정
================================================== */

* {
    box-sizing: border-box;
}


body {
    margin: 0;

    font-family:
        Arial,
        sans-serif;
}


/* ==================================================
   게임 전체 화면
================================================== */

#game {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    background-image:
        url("background.jpg");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;
}


/* ==================================================
   제목
================================================== */

#title {

    position: absolute;

    top: 20px;
    left: 50%;

    transform:
        translateX(-50%);

    font-size: 40px;

    font-weight: bold;

    color: white;

    text-shadow:
        3px 3px 0 #333,
        -1px -1px 0 #333,
        1px -1px 0 #333,
        -1px 1px 0 #333,
        1px 1px 0 #333;

    z-index: 5;
}


/* ==================================================
   점수판
   score-ui-square.png
================================================== */

#score-box {

    position: absolute;

    top: 85px;
    left: 50%;

    transform:
        translateX(-50%);

    width: 250px;
    height: 85px;

    background-color:
        transparent;

    background-image:
        url("score-ui-square.png");

    background-size:
        100% 100%;

    background-position:
        center;

    background-repeat:
        no-repeat;

    z-index: 5;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
}


/* ==================================================
   점수판 내부
================================================== */

#score-cover {

    position: absolute;

    left: 16%;
    right: 16%;

    top: 25%;
    bottom: 25%;

    background:
        #fff0d0;

    border-radius:
        0;

    z-index: 1;
}


/* ==================================================
   실제 점수
================================================== */

#score {

    position: relative;

    z-index: 2;

    font-size: 24px;

    font-weight: bold;

    color: white;

    text-shadow:
        2px 2px 0 #5a2a15,
        -1px -1px 0 #5a2a15,
        1px -1px 0 #5a2a15,
        -1px 1px 0 #5a2a15;

    white-space:
        nowrap;
}


/* ==================================================
   타이머
================================================== */

#timer-box {

    position: absolute;

    top: 180px;
    left: 50%;

    transform:
        translateX(-50%);

    width: 220px;
    height: 70px;

    background:
        #e7c98f;

    border:
        5px solid #6b351d;

    border-radius:
        0;

    box-shadow:
        0 5px 10px
        rgba(0,0,0,0.3);

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 5;
}


/* ==================================================
   타이머 내부
================================================== */

#timer-inner {

    position: absolute;

    left: 8px;
    right: 8px;

    top: 8px;
    bottom: 8px;

    border:
        3px solid #a86632;

    background:
        #fff0c9;

    border-radius:
        0;
}


/* ==================================================
   실제 타이머 숫자
================================================== */

#timer {

    position: relative;

    z-index: 2;

    font-family:
        "Courier New",
        monospace;

    font-size: 32px;

    font-weight: bold;

    color:
        #6b351d;

    letter-spacing:
        3px;

    text-shadow:
        1px 1px 0 white;

    white-space:
        nowrap;
}


/* ==================================================
   마지막 10초
================================================== */

#timer.warning {

    color:
        red;

    animation:
        timerWarning
        0.5s
        infinite
        alternate;
}


@keyframes timerWarning {

    from {

        transform:
            scale(1);

    }

    to {

        transform:
            scale(1.08);

    }
}


/* ==================================================
   선택 합
   ★ 위치 고정 : 220px
================================================== */

#current-sum {

    position: absolute;

    left: 50%;

    bottom: 220px;

    transform:
        translateX(-50%);

    font-size: 20px;

    font-weight: bold;

    color: white;

    text-shadow:
        2px 2px 0 #333,
        -1px -1px 0 #333;

    white-space:
        nowrap;

    z-index: 8;
}


/* ==================================================
   오류 메시지
   ★ 위치 고정 : 250px
================================================== */

#message {

    position: absolute;

    left: 50%;

    bottom: 250px;

    transform:
        translateX(-50%);

    font-size: 20px;

    font-weight: bold;

    color: white;

    text-shadow:
        2px 2px 0 #333,
        -1px -1px 0 #333;

    white-space:
        nowrap;

    z-index: 8;
}


/* ==================================================
   ★ 10 완성 연출 전체
================================================== */

#ten-effect {

    position: absolute;

    left: 50%;
    top: 48%;

    transform:
        translate(-50%, -50%)
        scale(0);

    z-index: 20;

    pointer-events:
        none;

    opacity: 0;
}


/* ==================================================
   ★ 10 완성 문구
================================================== */

#ten-effect-text {

    padding:
        18px 35px;

    background:
        rgba(255, 248, 190, 0.95);

    border:
        6px solid #d58b22;

    border-radius:
        18px;

    color:
        #c83a1c;

    font-size:
        38px;

    font-weight:
        900;

    white-space:
        nowrap;

    text-shadow:
        2px 2px 0 white,
        4px 4px 0 #8b4a18;

    box-shadow:
        0 0 0 8px
        rgba(255, 220, 80, 0.3),

        0 0 35px
        rgba(255, 190, 30, 0.9);
}


/* ==================================================
   ★ 10 완성 애니메이션
================================================== */

#ten-effect.show {

    animation:
        tenComplete
        0.9s
        ease-out
        forwards;
}


@keyframes tenComplete {

    0% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0.2)
            rotate(-8deg);
    }


    35% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.2)
            rotate(3deg);
    }


    60% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(0.95)
            rotate(-2deg);
    }


    80% {

        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.05)
            rotate(0deg);
    }


    100% {

        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(1.25);
    }
}


/* ==================================================
   ★ 10 완성 시 카드 효과
================================================== */

.card.ten-complete {

    animation:
        tenCardComplete
        0.65s
        ease-out
        forwards;

    z-index: 15;
}


@keyframes tenCardComplete {

    0% {

        transform:
            translateY(-25px)
            scale(1);

        filter:
            brightness(1);
    }


    30% {

        transform:
            translateY(-35px)
            scale(1.18);

        filter:
            brightness(1.8)
            drop-shadow(
                0 0 10px
                #ffe45c
            );
    }


    65% {

        transform:
            translateY(-20px)
            scale(1.08);

        filter:
            brightness(2)
            drop-shadow(
                0 0 18px
                #fff000
            );
    }


    100% {

        transform:
            translateY(-10px)
            scale(0);

        opacity:
            0;

        filter:
            brightness(3)
            drop-shadow(
                0 0 25px
                #fff000
            );
    }
}


/* ==================================================
   카드더미
================================================== */

#deck-area {

    position: absolute;

    top: 100px;
    right: 40px;

    text-align:
        center;

    z-index:
        5;
}


#deck {

    width: 90px;
    height: 130px;

    background:
        #d94b4b;

    border:
        4px solid white;

    border-radius:
        12px;

    box-shadow:
        0 5px 12px
        rgba(0,0,0,0.3);

    display: flex;

    justify-content:
        center;

    align-items:
        center;

    color:
        white;

    font-size:
        18px;

    font-weight:
        bold;

    cursor:
        pointer;

    user-select:
        none;

    transition:
        0.15s;
}


#deck:hover {

    transform:
        translateY(-5px)
        scale(1.03);
}


#deck:active {

    transform:
        translateY(2px);
}


#deck-count {

    margin-top:
        8px;

    font-size:
        20px;

    font-weight:
        bold;

    color:
        white;

    text-shadow:
        2px 2px 0 #333;
}


/* ==================================================
   손패
================================================== */

.hand {

    position: absolute;

    left: 50%;
    bottom: 50px;

    transform:
        translateX(-50%);

    width:
        94%;

    min-height:
        180px;

    display:
        flex;

    justify-content:
        center;

    align-items:
        flex-end;

    gap:
        12px;

    padding:
        20px;

    overflow:
        visible;

    z-index:
        5;
}


/* ==================================================
   카드
================================================== */

.card {

    position:
        relative;

    flex:
        0 1 80px;

    width:
        80px;

    height:
        120px;

    min-width:
        45px;

    background-image:
        url("card-back.png");

    background-size:
        cover;

    background-position:
        center;

    border:
        3px solid #6b1d1d;

    border-radius:
        12px;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    cursor:
        pointer;

    user-select:
        none;

    box-shadow:
        0 5px 10px
        rgba(0,0,0,0.3);

    transition:
        transform 0.15s,
        box-shadow 0.15s;

    color:
        transparent;
}


/* ==================================================
   카드 중앙 마름모
================================================== */

.card::before {

    content:
        "";

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    width:
        48px;

    height:
        48px;

    transform:
        translate(-50%, -50%)
        rotate(45deg);

    background:
        #fff4dc;

    border:
        2px solid #c72f2f;

    border-radius:
        2px;

    z-index:
        1;
}


/* ==================================================
   카드 숫자
================================================== */

.card::after {

    content:
        attr(data-number);

    position:
        absolute;

    left:
        50%;

    top:
        50%;

    transform:
        translate(-50%, -50%);

    font-size:
        30px;

    font-weight:
        bold;

    color:
        #b51f1f;

    z-index:
        2;
}


/* ==================================================
   카드 마우스 오버
================================================== */

.card:hover {

    transform:
        translateY(-15px);

    box-shadow:
        0 10px 18px
        rgba(0,0,0,0.35);
}


/* ==================================================
   선택된 카드
================================================== */

.card.selected {

    background-color:
        #ffdede;

    border-color:
        red;

    transform:
        translateY(-25px);

    box-shadow:
        0 8px 18px
        rgba(255,0,0,0.4);
}


/* ==================================================
   시작 / 종료 화면
================================================== */

.overlay {

    position:
        absolute;

    inset:
        0;

    background:
        rgba(0,0,0,0.55);

    display:
        flex;

    flex-direction:
        column;

    justify-content:
        center;

    align-items:
        center;

    color:
        white;

    z-index:
        30;
}


.overlay h1 {

    font-size:
        52px;

    margin-bottom:
        20px;

    text-shadow:
        3px 3px 0 #333;
}


/* ==================================================
   최종 점수
================================================== */

#final-score {

    font-size:
        26px;

    font-weight:
        bold;

    margin-bottom:
        20px;
}


/* ==================================================
   버튼
================================================== */

button {

    padding:
        15px 30px;

    font-size:
        22px;

    font-weight:
        bold;

    border:
        none;

    border-radius:
        10px;

    cursor:
        pointer;

    box-shadow:
        0 4px 8px
        rgba(0,0,0,0.3);

    transition:
        0.15s;
}


button:hover {

    transform:
        scale(1.05);
}


button:active {

    transform:
        scale(0.97);
}


/* ==================================================
   숨김
================================================== */

.hidden {

    display:
        none;
}


/* ==================================================
   모바일
================================================== */

@media (max-width: 700px) {


    #title {

        font-size:
            30px;

        top:
            15px;
    }


    #score-box {

        top:
            65px;

        width:
            200px;

        height:
            68px;
    }


    #score {

        font-size:
            20px;
    }


    #timer-box {

        top:
            145px;

        width:
            180px;

        height:
            60px;
    }


    #timer {

        font-size:
            25px;
    }


    /* ★ 합계값 위치 유지 */

    #current-sum {

        bottom:
            220px;

        font-size:
            16px;
    }


    /* ★ 오류문구 위치 유지 */

    #message {

        bottom:
            250px;

        font-size:
            16px;
    }


    #ten-effect-text {

        font-size:
            27px;

        padding:
            14px 24px;
    }


    #deck-area {

        top:
            90px;

        right:
            15px;
    }


    #deck {

        width:
            70px;

        height:
            100px;

        font-size:
            14px;
    }


    .hand {

        width:
            100%;

        bottom:
            30px;

        gap:
            5px;

        padding:
            10px;
    }


    .card {

        height:
            100px;

        min-width:
            38px;
    }


    .card::before {

        width:
            40px;

        height:
            40px;
    }


    .card::after {

        font-size:
            26px;
    }


    .overlay h1 {

        font-size:
            40px;
    }

}

</style>

</head>


<body>


<div id="game">


    <!-- ==================================
         제목
    ================================== -->

    <div id="title">
        🍎 사과팡 🍎
    </div>


    <!-- ==================================
         점수판
    ================================== -->

    <div id="score-box">

        <div id="score-cover"></div>

        <div id="score">
            Score: 00
        </div>

    </div>


    <!-- ==================================
         타이머
    ================================== -->

    <div id="timer-box">

        <div id="timer-inner"></div>

        <div id="timer">
            00:30
        </div>

    </div>


    <!-- ==================================
         선택 합
    ================================== -->

    <div id="current-sum">
        선택 합: 0
    </div>


    <!-- ==================================
         오류 메시지
    ================================== -->

    <div id="message"></div>


    <!-- ==================================
         ★ 10 완성 연출
    ================================== -->

    <div id="ten-effect">

        <div id="ten-effect-text">
            🎉 10 완성! 🎉
        </div>

    </div>


    <!-- ==================================
         카드더미
    ================================== -->

    <div id="deck-area">

        <div id="deck">
            카드더미
        </div>

        <div id="deck-count">
            Click
        </div>

    </div>


    <!-- ==================================
         손패
    ================================== -->

    <div id="hand"
         class="hand">
    </div>


    <!-- ==================================
         게임 시작
    ================================== -->

    <div id="start-screen"
         class="overlay">

        <h1>
            🍎 사과팡
        </h1>

        <button id="start-button">
            게임 시작
        </button>

    </div>


    <!-- ==================================
         게임 종료
    ================================== -->

    <div id="game-over"
         class="overlay hidden">

        <h1>
            게임 종료!
        </h1>

        <div id="final-score">
            최종 점수: 0
        </div>

        <button id="restart-button">
            다시하기
        </button>

    </div>


</div>


<script>


/* ==================================================
   게임 설정
================================================== */

const INITIAL_HAND_SIZE =
    7;


/* 전체 게임 시간 */

const GAME_TIME =
    30;


/* ==================================================
   게임 변수
================================================== */

let hand = [];

let selectedCards = [];

let score = 0;

let timeLeft =
    GAME_TIME;

let timerInterval =
    null;

let gameStarted =
    false;


/*
   10 완성 연출 중인지 확인

   연출 중에는 카드 클릭을
   잠시 막는다.
*/

let isCompleting =
    false;


/* ==================================================
   HTML 요소
================================================== */

const handElement =
    document.getElementById(
        "hand"
    );


const scoreElement =
    document.getElementById(
        "score"
    );


const timerElement =
    document.getElementById(
        "timer"
    );


const deckElement =
    document.getElementById(
        "deck"
    );


const currentSumElement =
    document.getElementById(
        "current-sum"
    );


const messageElement =
    document.getElementById(
        "message"
    );


const tenEffect =
    document.getElementById(
        "ten-effect"
    );


const startScreen =
    document.getElementById(
        "start-screen"
    );


const gameOverScreen =
    document.getElementById(
        "game-over"
    );


const startButton =
    document.getElementById(
        "start-button"
    );


const restartButton =
    document.getElementById(
        "restart-button"
    );


const finalScoreElement =
    document.getElementById(
        "final-score"
    );


/* ==================================================
   게임 초기화
================================================== */

function resetGame() {

    clearInterval(
        timerInterval
    );


    hand = [];

    selectedCards = [];

    score = 0;

    timeLeft =
        GAME_TIME;

    gameStarted =
        false;

    isCompleting =
        false;


    handElement.innerHTML =
        "";


    scoreElement.textContent =
        "Score: 00";


    timerElement.textContent =
        "00:30";


    timerElement.classList.remove(
        "warning"
    );


    currentSumElement.textContent =
        "선택 합: 0";


    messageElement.textContent =
        "";


    tenEffect.classList.remove(
        "show"
    );


    finalScoreElement.textContent =
        "최종 점수: 0";
}


/* ==================================================
   랜덤 카드
   1 ~ 9
================================================== */

function createRandomCard() {

    return Math.floor(
        Math.random() * 9
    ) + 1;
}


/* ==================================================
   카드 추가
================================================== */

function drawCards(
    count
) {

    for (
        let i = 0;
        i < count;
        i++
    ) {

        hand.push(
            createRandomCard()
        );

    }
}


/* ==================================================
   게임 시작
================================================== */

function startGame() {

    resetGame();


    gameStarted =
        true;


    startScreen.classList.add(
        "hidden"
    );


    gameOverScreen.classList.add(
        "hidden"
    );


    drawCards(
        INITIAL_HAND_SIZE
    );


    renderHand();

    updateScore();

    startTimer();
}


/* ==================================================
   카드더미 클릭
================================================== */

function drawOneCard() {

    if (
        !gameStarted
    ) {
        return;
    }


    if (
        timeLeft <= 0
    ) {
        return;
    }


    if (
        isCompleting
    ) {
        return;
    }


    /* 카드 1장 추가 */

    hand.push(
        createRandomCard()
    );


    /* 점수 1 감소 */

    score--;


    updateScore();

    renderHand();
}


/* ==================================================
   손패 출력
================================================== */

function renderHand() {

    handElement.innerHTML =
        "";


    /* 카드가 많아질수록 간격 감소 */

    let gap =
        12;


    if (
        hand.length > 10
    ) {

        gap =
            6;
    }


    if (
        hand.length > 14
    ) {

        gap =
            3;
    }


    handElement.style.gap =
        gap + "px";


    /* 카드 생성 */

    hand.forEach(
        (
            number,
            index
        ) => {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.dataset.number =
                number;


            /* 선택 상태 */

            if (
                selectedCards.includes(
                    index
                )
            ) {

                card.classList.add(
                    "selected"
                );
            }


            /* 카드 클릭 */

            card.addEventListener(
                "click",
                function() {

                    selectCard(
                        index
                    );

                }
            );


            handElement.appendChild(
                card
            );

        }
    );
}


/* ==================================================
   카드 선택
================================================== */

function selectCard(
    index
) {

    if (
        !gameStarted
    ) {
        return;
    }


    if (
        isCompleting
    ) {
        return;
    }


    const selectedIndex =
        selectedCards.indexOf(
            index
        );


    /* 선택 해제 */

    if (
        selectedIndex !== -1
    ) {

        selectedCards.splice(
            selectedIndex,
            1
        );

    }


    /* 선택 */

    else {

        selectedCards.push(
            index
        );

    }


    updateCurrentSum();

    renderHand();

    checkSelectedCards();
}


/* ==================================================
   선택 합 계산
================================================== */

function updateCurrentSum() {

    let sum =
        0;


    selectedCards.forEach(
        index => {

            sum +=
                hand[index];

        }
    );


    currentSumElement.textContent =
        "선택 합: " + sum;
}


/* ==================================================
   선택 카드 확인
================================================== */

function checkSelectedCards() {

    let sum =
        0;


    selectedCards.forEach(
        index => {

            sum +=
                hand[index];

        }
    );


    /* ==========================================
       ★ 정확히 10
    ========================================== */

    if (
        sum === 10
    ) {

        completeTen();

        return;
    }


    /* ==========================================
       합이 10 초과
    ========================================== */

    if (
        sum > 10
    ) {

        messageElement.textContent =
            "합이 10을 넘었습니다!";


        setTimeout(
            () => {

                selectedCards =
                    [];


                messageElement.textContent =
                    "";


                updateCurrentSum();

                renderHand();

            },
            500
        );
    }
}


/* ==================================================
   ★ 10 완성 연출
================================================== */

function completeTen() {

    if (
        isCompleting
    ) {
        return;
    }


    isCompleting =
        true;


    /*
       선택된 카드에
       10 완성 애니메이션 적용
    */

    const selectedCardElements =
        handElement.querySelectorAll(
            ".card.selected"
        );


    selectedCardElements.forEach(
        card => {

            card.classList.add(
                "ten-complete"
            );

        }
    );


    /*
       중앙의
       "10 완성!" 표시
    */

    tenEffect.classList.remove(
        "show"
    );


    /*
       브라우저가 애니메이션을
       다시 시작하도록 한 번 읽기
    */

    void tenEffect.offsetWidth;


    tenEffect.classList.add(
        "show"
    );


    /*
       0.65초 동안
       카드 연출을 보여준 뒤
       실제 카드 제거
    */

    setTimeout(
        () => {

            removeCompletedCards();

        },
        650
    );
}


/* ==================================================
   ★ 10 완성 카드 제거
================================================== */

function removeCompletedCards() {

    const removeCount =
        selectedCards.length;


    /*
       제거한 카드 수만큼
       점수 증가
    */

    score +=
        removeCount;


    /*
       뒤쪽 카드부터 제거
    */

    selectedCards.sort(
        (a, b) =>
            b - a
    );


    selectedCards.forEach(
        index => {

            hand.splice(
                index,
                1
            );

        }
    );


    selectedCards =
        [];


    /*
       손패가 7장보다 적으면
       7장까지 자동 보충
    */

    if (
        hand.length <
        INITIAL_HAND_SIZE
    ) {

        drawCards(
            INITIAL_HAND_SIZE -
            hand.length
        );
    }


    updateScore();

    updateCurrentSum();

    renderHand();


    /*
       잠시 후 다시 카드 클릭 가능
    */

    setTimeout(
        () => {

            isCompleting =
                false;

        },
        100
    );
}


/* ==================================================
   점수 업데이트
================================================== */

function updateScore() {

    const formattedScore =
        String(score)
            .padStart(
                2,
                "0"
            );


    scoreElement.textContent =
        "Score: " +
        formattedScore;
}


/* ==================================================
   타이머 시작
================================================== */

function startTimer() {

    clearInterval(
        timerInterval
    );


    timerInterval =
        setInterval(
            () => {


                timeLeft--;


                /*
                   00:XX 형태
                */

                timerElement.textContent =
                    "00:" +
                    String(
                        timeLeft
                    ).padStart(
                        2,
                        "0"
                    );


                /*
                   ★ 마지막 10초
                */

                if (
                    timeLeft <= 10
                ) {

                    timerElement.classList.add(
                        "warning"
                    );
                }


                /*
                   게임 종료
                */

                if (
                    timeLeft <= 0
                ) {

                    clearInterval(
                        timerInterval
                    );


                    endGame();
                }


            },
            1000
        );
}


/* ==================================================
   게임 종료
================================================== */

function endGame() {

    gameStarted =
        false;


    isCompleting =
        false;


    clearInterval(
        timerInterval
    );


    finalScoreElement.textContent =
        "최종 점수: " +
        score;


    gameOverScreen.classList.remove(
        "hidden"
    );
}


/* ==================================================
   다시하기
================================================== */

function restartGame() {

    resetGame();


    gameStarted =
        true;


    startScreen.classList.add(
        "hidden"
    );


    gameOverScreen.classList.add(
        "hidden"
    );


    drawCards(
        INITIAL_HAND_SIZE
    );


    renderHand();

    updateScore();

    startTimer();
}


/* ==================================================
   버튼 이벤트
================================================== */

startButton.addEventListener(
    "click",
    startGame
);


restartButton.addEventListener(
    "click",
    restartGame
);


/* ==================================================
   카드더미 이벤트
================================================== */

deckElement.addEventListener(
    "click",
    drawOneCard
);


</script>
