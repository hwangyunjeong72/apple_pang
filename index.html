<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>사과팡</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }


        /* =========================
           게임 전체 화면
        ========================= */

        #game {
            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background-image: url("background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* =========================
           제목
        ========================= */

        #title {

            position: absolute;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 40px;
            font-weight: bold;

            color: white;

            text-shadow:
                3px 3px 0 #333,
                -1px -1px 0 #333,
                1px -1px 0 #333,
                -1px 1px 0 #333,
                1px 1px 0 #333;

            z-index: 5;
        }


        /* ==================================================
           ★ 점수 UI
           
           score-ui.png를 점수판 배경으로 사용
        ================================================== */

        #score-box {

            position: absolute;

            top: 85px;
            left: 50%;

            transform: translateX(-50%);

            width: 250px;
            height: 85px;

            background-image: url("score-ui.png");

            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;

            z-index: 5;

            display: flex;

            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /* =========================
           이미지 안의 기존 Score:00
           를 가리는 영역
        ========================= */

        #score-cover {

            position: absolute;

            left: 16%;
            right: 16%;

            top: 25%;
            bottom: 25%;

            background: #fff0d0;

            border-radius: 15px;

            z-index: 1;
        }


        /* =========================
           실제 게임 점수
        ========================= */

        #score {

            position: relative;

            z-index: 2;

            font-size: 24px;

            font-weight: bold;

            color: white;

            text-shadow:
                2px 2px 0 #5a2a15,
                -1px -1px 0 #5a2a15,
                1px -1px 0 #5a2a15,
                -1px 1px 0 #5a2a15;

            white-space: nowrap;
        }


        /* =========================
           타이머
        ========================= */

        #timer {

            position: absolute;

            top: 180px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 20px;

            font-weight: bold;

            color: white;

            text-shadow:
                2px 2px 0 #333,
                -1px -1px 0 #333;

            z-index: 5;
        }


        /* 마지막 5초 */

        #timer.warning {

            color: red;

            text-shadow:
                2px 2px 0 white;
        }


        /* =========================
           선택 합
        ========================= */

        #current-sum {

            position: absolute;

            left: 50%;

            bottom: 180px;

            transform: translateX(-50%);

            font-size: 20px;

            font-weight: bold;

            color: white;

            text-shadow:
                2px 2px 0 #333,
                -1px -1px 0 #333;

            white-space: nowrap;

            z-index: 5;
        }


        /* =========================
           오류 메시지
        ========================= */

        #message {

            position: absolute;

            left: 50%;

            bottom: 225px;

            transform: translateX(-50%);

            font-size: 20px;

            font-weight: bold;

            color: white;

            text-shadow:
                2px 2px 0 #333,
                -1px -1px 0 #333;

            white-space: nowrap;

            z-index: 5;
        }


        /* =========================
           카드더미
        ========================= */

        #deck-area {

            position: absolute;

            top: 100px;
            right: 40px;

            text-align: center;

            z-index: 5;
        }


        #deck {

            width: 90px;
            height: 130px;

            background: #d94b4b;

            border: 4px solid white;

            border-radius: 12px;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.3);

            display: flex;

            justify-content: center;
            align-items: center;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            user-select: none;

            transition: 0.15s;
        }


        #deck:hover {

            transform:
                translateY(-5px)
                scale(1.03);
        }


        #deck:active {

            transform:
                translateY(2px);
        }


        #deck-count {

            margin-top: 8px;

            font-size: 20px;

            font-weight: bold;

            color: white;

            text-shadow:
                2px 2px 0 #333;
        }


        /* =========================
           손패
        ========================= */

        .hand {

            position: absolute;

            left: 50%;

            bottom: 50px;

            transform: translateX(-50%);

            width: 94%;

            min-height: 180px;

            display: flex;

            justify-content: center;

            align-items: flex-end;

            gap: 12px;

            padding: 20px;

            overflow: visible;

            z-index: 5;
        }


        /* =========================
           카드
        ========================= */

        .card {

            position: relative;

            flex: 0 1 80px;

            width: 80px;
            height: 120px;

            min-width: 45px;

            background-image:
                url("card-back.png");

            background-size: cover;

            background-position: center;

            border: 3px solid #6b1d1d;

            border-radius: 12px;

            display: flex;

            justify-content: center;
            align-items: center;

            cursor: pointer;

            user-select: none;

            box-shadow:
                0 5px 10px rgba(0, 0, 0, 0.3);

            transition:
                transform 0.15s,
                box-shadow 0.15s;
        }


        /* =========================
           가운데 마름모
        ========================= */

        .card::before {

            content: "";

            position: absolute;

            left: 50%;
            top: 50%;

            width: 48px;
            height: 48px;

            transform:
                translate(-50%, -50%)
                rotate(45deg);

            background: #fff4dc;

            border: 2px solid #c72f2f;

            border-radius: 2px;

            z-index: 1;
        }


        /* =========================
           카드 숫자
        ========================= */

        .card {

            color: transparent;

            font-size: 30px;

            font-weight: bold;
        }


        .card::after {

            content: attr(data-number);

            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            font-size: 30px;

            font-weight: bold;

            color: #b51f1f;

            z-index: 2;
        }


        /* =========================
           카드 마우스 오버
        ========================= */

        .card:hover {

            transform:
                translateY(-15px);

            box-shadow:
                0 10px 18px
                rgba(0, 0, 0, 0.35);
        }


        /* =========================
           선택된 카드
        ========================= */

        .card.selected {

            background-color: #ffdede;

            border-color: red;

            transform:
                translateY(-25px);

            box-shadow:
                0 8px 18px
                rgba(255, 0, 0, 0.4);
        }


        /* =========================
           시작 / 게임 종료 화면
        ========================= */

        .overlay {

            position: absolute;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.55);

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            color: white;

            z-index: 10;
        }


        .overlay h1 {

            font-size: 52px;

            margin-bottom: 20px;

            text-shadow:
                3px 3px 0 #333;
        }


        #final-score {

            font-size: 26px;

            font-weight: bold;

            margin-bottom: 20px;
        }


        /* =========================
           버튼
        ========================= */

        button {

            padding: 15px 30px;

            font-size: 22px;

            font-weight: bold;

            border: none;

            border-radius: 10px;

            cursor: pointer;

            box-shadow:
                0 4px 8px
                rgba(0, 0, 0, 0.3);

            transition: 0.15s;
        }


        button:hover {

            transform:
                scale(1.05);
        }


        button:active {

            transform:
                scale(0.97);
        }


        /* =========================
           숨김
        ========================= */

        .hidden {

            display: none;
        }


        /* =========================
           모바일
        ========================= */

        @media (max-width: 700px) {

            #title {

                font-size: 30px;

                top: 15px;
            }


            #score-box {

                top: 65px;

                width: 200px;
                height: 68px;
            }


            #score {

                font-size: 20px;
            }


            #timer {

                top: 140px;

                font-size: 16px;
            }


            #current-sum {

                bottom: 125px;

                font-size: 16px;
            }


            #message {

                bottom: 165px;

                font-size: 16px;
            }


            #deck-area {

                top: 90px;

                right: 15px;
            }


            #deck {

                width: 70px;

                height: 100px;

                font-size: 14px;
            }


            .hand {

                width: 100%;

                bottom: 30px;

                gap: 5px;

                padding: 10px;
            }


            .card {

                height: 100px;

                min-width: 38px;
            }


            .card::before {

                width: 40px;
                height: 40px;
            }


            .card::after {

                font-size: 26px;
            }


            .overlay h1 {

                font-size: 40px;
            }

        }

    </style>

</head>


<body>

<div id="game">


    <!-- =========================
         제목
    ========================= -->

    <div id="title">
        🍎 사과팡 🍎
    </div>


    <!-- ==================================================
         ★ 점수 UI
         
         score-ui.png를 사용
    ================================================== -->

    <div id="score-box">

        <!-- 이미지에 들어있는 Score:00을 가림 -->
        <div id="score-cover"></div>

        <!-- 실제 점수 -->
        <div id="score">
            Score: 00
        </div>

    </div>


    <!-- =========================
         타이머
    ========================= -->

    <div id="timer">
        시간: 30
    </div>


    <!-- =========================
         오류 메시지
    ========================= -->

    <div id="message"></div>


    <!-- =========================
         선택 합
    ========================= -->

    <div id="current-sum">
        선택 합: 0
    </div>


    <!-- =========================
         카드더미
    ========================= -->

    <div id="deck-area">

        <div id="deck">
            카드더미
        </div>

        <div id="deck-count">
            Click
        </div>

    </div>


    <!-- =========================
         손패
    ========================= -->

    <div id="hand" class="hand"></div>


    <!-- =========================
         게임 시작 화면
    ========================= -->

    <div id="start-screen" class="overlay">

        <h1>
            🍎 사과팡
        </h1>

        <button id="start-button">
            게임 시작
        </button>

    </div>


    <!-- =========================
         게임 종료 화면
    ========================= -->

    <div id="game-over" class="overlay hidden">

        <h1>
            게임 종료!
        </h1>

        <div id="final-score">
            최종 점수: 0
        </div>

        <button id="restart-button">
            다시하기
        </button>

    </div>

</div>


<script>


    /* =========================
       게임 기본 설정
    ========================= */

    const INITIAL_HAND_SIZE = 7;

    const GAME_TIME = 30;


    /* =========================
       게임 변수
    ========================= */

    let hand = [];

    let selectedCards = [];

    let score = 0;

    let timeLeft = GAME_TIME;

    let timerInterval = null;

    let gameStarted = false;


    /* =========================
       HTML 요소
    ========================= */

    const handElement =
        document.getElementById("hand");

    const scoreElement =
        document.getElementById("score");

    const timerElement =
        document.getElementById("timer");

    const deckElement =
        document.getElementById("deck");

    const currentSumElement =
        document.getElementById("current-sum");

    const messageElement =
        document.getElementById("message");

    const startScreen =
        document.getElementById("start-screen");

    const gameOverScreen =
        document.getElementById("game-over");

    const startButton =
        document.getElementById("start-button");

    const restartButton =
        document.getElementById("restart-button");

    const finalScoreElement =
        document.getElementById("final-score");


    /* =========================
       게임 초기화
    ========================= */

    function resetGame() {

        clearInterval(timerInterval);

        hand = [];

        selectedCards = [];

        score = 0;

        timeLeft = GAME_TIME;

        gameStarted = false;

        handElement.innerHTML = "";

        scoreElement.textContent =
            "Score: 00";

        timerElement.textContent =
            "시간: 30";

        timerElement.classList.remove(
            "warning"
        );

        currentSumElement.textContent =
            "선택 합: 0";

        messageElement.textContent = "";

        finalScoreElement.textContent =
            "최종 점수: 0";
    }


    /* =========================
       랜덤 카드
       1 ~ 9
    ========================= */

    function createRandomCard() {

        return Math.floor(
            Math.random() * 9
        ) + 1;
    }


    /* =========================
       카드 추가
    ========================= */

    function drawCards(count) {

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const randomCard =
                createRandomCard();

            hand.push(randomCard);
        }
    }


    /* =========================
       게임 시작
    ========================= */

    function startGame() {

        resetGame();

        gameStarted = true;

        startScreen.classList.add(
            "hidden"
        );

        gameOverScreen.classList.add(
            "hidden"
        );

        drawCards(
            INITIAL_HAND_SIZE
        );

        renderHand();

        updateScore();

        startTimer();
    }


    /* =========================
       카드더미 클릭
       카드 +1
       점수 -1
    ========================= */

    function drawOneCard() {

        if (!gameStarted) return;

        if (timeLeft <= 0) return;

        const randomCard =
            createRandomCard();

        hand.push(randomCard);

        score--;

        updateScore();

        renderHand();
    }


    /* =========================
       손패 표시
    ========================= */

    function renderHand() {

        handElement.innerHTML = "";


        /* 카드가 많아지면 간격 감소 */

        let gap = 12;

        if (hand.length > 10) {

            gap = 6;
        }

        if (hand.length > 14) {

            gap = 3;
        }

        handElement.style.gap =
            gap + "px";


        /* 카드 생성 */

        hand.forEach(
            (number, index) => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "card";


                /* 숫자 저장 */

                card.dataset.number =
                    number;


                /* 선택된 카드 */

                if (
                    selectedCards.includes(
                        index
                    )
                ) {

                    card.classList.add(
                        "selected"
                    );
                }


                /* 카드 클릭 */

                card.addEventListener(
                    "click",
                    function() {

                        selectCard(index);

                    }
                );


                handElement.appendChild(
                    card
                );

            }
        );
    }


    /* =========================
       카드 선택
    ========================= */

    function selectCard(index) {

        if (!gameStarted) return;


        const selectedIndex =
            selectedCards.indexOf(
                index
            );


        if (selectedIndex !== -1) {

            selectedCards.splice(
                selectedIndex,
                1
            );

        } else {

            selectedCards.push(index);
        }


        updateCurrentSum();

        renderHand();

        checkSelectedCards();
    }


    /* =========================
       선택 합 계산
    ========================= */

    function updateCurrentSum() {

        let sum = 0;


        selectedCards.forEach(
            index => {

                sum += hand[index];

            }
        );


        currentSumElement.textContent =
            "선택 합: " + sum;
    }


    /* =========================
       선택 카드 확인
    ========================= */

    function checkSelectedCards() {

        let sum = 0;


        selectedCards.forEach(
            index => {

                sum += hand[index];

            }
        );


        /* 합이 정확히 10 */

        if (sum === 10) {

            removeSelectedCards();
        }


        /* 합이 10 초과 */

        else if (sum > 10) {

            messageElement.textContent =
                "합이 10을 넘었습니다!";


            setTimeout(() => {

                selectedCards = [];

                messageElement.textContent =
                    "";

                updateCurrentSum();

                renderHand();

            }, 500);
        }
    }


    /* =========================
       선택 카드 제거
    ========================= */

    function removeSelectedCards() {

        const removeCount =
            selectedCards.length;


        /* 제거한 카드 수만큼 점수 증가 */

        score += removeCount;


        /* 뒤쪽부터 제거 */

        selectedCards.sort(
            (a, b) => b - a
        );


        selectedCards.forEach(
            index => {

                hand.splice(
                    index,
                    1
                );

            }
        );


        selectedCards = [];


        /* 손패가 7장보다 적으면 보충 */

        const needCards =
            INITIAL_HAND_SIZE -
            hand.length;


        if (needCards > 0) {

            drawCards(
                needCards
            );
        }


        updateScore();

        updateCurrentSum();

        renderHand();
    }


    /* =========================
       ★ 점수 업데이트
    ========================= */

    function updateScore() {

        /*
           점수를 두 자리 숫자로 표시

           0  → 00
           5  → 05
           15 → 15
        */

        const formattedScore =
            String(score).padStart(
                2,
                "0"
            );


        scoreElement.textContent =
            "Score: " + formattedScore;
    }


    /* =========================
       타이머
    ========================= */

    function startTimer() {

        clearInterval(
            timerInterval
        );


        timerInterval =
            setInterval(() => {

                timeLeft--;


                timerElement.textContent =
                    "시간: " + timeLeft;


                /* 마지막 5초 */

                if (timeLeft <= 5) {

                    timerElement.classList.add(
                        "warning"
                    );
                }


                /* 시간 종료 */

                if (timeLeft <= 0) {

                    clearInterval(
                        timerInterval
                    );

                    endGame();
                }

            }, 1000);
    }


    /* =========================
       게임 종료
    ========================= */

    function endGame() {

        gameStarted = false;

        clearInterval(
            timerInterval
        );


        finalScoreElement.textContent =
            "최종 점수: " + score;


        gameOverScreen.classList.remove(
            "hidden"
        );
    }


    /* =========================
       다시하기
    ========================= */

    function restartGame() {

        resetGame();

        gameStarted = true;

        startScreen.classList.add(
            "hidden"
        );

        gameOverScreen.classList.add(
            "hidden"
        );

        drawCards(
            INITIAL_HAND_SIZE
        );

        renderHand();

        updateScore();

        startTimer();
    }


    /* =========================
       버튼 이벤트
    ========================= */

    startButton.addEventListener(
        "click",
        startGame
    );


    restartButton.addEventListener(
        "click",
        restartGame
    );


    /* =========================
       카드더미 클릭
    ========================= */

    deckElement.addEventListener(
        "click",
        drawOneCard
    );

</script>

</body>

</html>
