<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>사과팡</title>

    <style>

        /* =========================
           기본 설정
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }


        /* =========================
           게임 전체
        ========================= */

        #game {
            position: relative;

            width: 100%;
            height: 100vh;

            overflow: hidden;

            background: #f5f5f5;
        }


        /* =========================
           제목
        ========================= */

        #title {
            position: absolute;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 40px;
            font-weight: bold;
        }


        /* =========================
           점수
        ========================= */

        #score {
            position: absolute;

            top: 25px;
            left: 30px;

            font-size: 24px;
            font-weight: bold;
        }


        /* =========================
           타이머
        ========================= */

        #timer {
            position: absolute;

            top: 60px;
            left: 30px;

            font-size: 24px;
            font-weight: bold;
        }


        /* 마지막 5초 */

        #timer.warning {
            color: red;
        }


        /* =========================
           현재 선택 합
        ========================= */

        #current-sum {
            position: absolute;

            top: 105px;
            left: 30px;

            font-size: 20px;
            font-weight: bold;
        }


        /* =========================
           메시지
        ========================= */

        #message {
            position: absolute;

            top: 150px;
            left: 50%;

            transform: translateX(-50%);

            font-size: 20px;
            font-weight: bold;
        }


        /* =========================
           카드더미
        ========================= */

        #deck-area {
            position: absolute;

            top: 100px;
            right: 40px;

            text-align: center;
        }


        #deck {
            width: 90px;
            height: 130px;

            background: #d94b4b;

            border: 4px solid white;
            border-radius: 12px;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
            user-select: none;

            transition: 0.15s;
        }


        #deck:hover {
            transform: translateY(-5px);
        }


        /* 카드더미 아래의 ∞ */

        #deck-count {
            margin-top: 8px;

            font-size: 24px;
            font-weight: bold;
        }


        /* =========================
           손패
        ========================= */

        .hand {

            position: absolute;

            left: 50%;
            bottom: 60px;

            transform: translateX(-50%);

            width: 90%;

            min-height: 180px;

            display: flex;

            justify-content: center;
            align-items: flex-end;

            gap: 12px;

            padding: 20px;

            overflow: visible;
        }


        /* =========================
           카드
        ========================= */

        .card {

            flex: 0 1 80px;

            width: 80px;
            height: 120px;

            min-width: 45px;

            background: white;

            border: 3px solid #333;
            border-radius: 12px;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 32px;
            font-weight: bold;

            cursor: pointer;

            user-select: none;

            transition: 0.15s;
        }


        /* 카드에 마우스를 올렸을 때 */

        .card:hover {

            transform: translateY(-15px);
        }


        /* 선택된 카드 */

        .card.selected {

            background: #ffdede;

            border-color: red;

            transform: translateY(-25px);
        }


        /* =========================
           시작 / 게임오버 화면
        ========================= */

        .overlay {

            position: absolute;

            inset: 0;

            background: rgba(0, 0, 0, 0.65);

            display: flex;

            flex-direction: column;

            justify-content: center;
            align-items: center;

            color: white;

            z-index: 10;
        }


        .overlay h1 {

            font-size: 48px;

            margin-bottom: 20px;
        }


        /* 버튼 */

        button {

            padding: 15px 30px;

            font-size: 22px;

            font-weight: bold;

            border: none;

            border-radius: 10px;

            cursor: pointer;
        }


        button:hover {

            transform: scale(1.05);
        }


        /* 화면 숨기기 */

        .hidden {

            display: none;
        }

    </style>

</head>


<body>


<div id="game">


    <!-- =========================
         제목
    ========================== -->

    <div id="title">
        사과팡
    </div>


    <!-- =========================
         점수
    ========================== -->

    <div id="score">
        점수: 0
    </div>


    <!-- =========================
         타이머
    ========================== -->

    <div id="timer">
        시간: 30
    </div>


    <!-- =========================
         선택한 카드의 합
    ========================== -->

    <div id="current-sum">
        선택 합: 0
    </div>


    <!-- =========================
         메시지
    ========================== -->

    <div id="message"></div>


    <!-- =========================
         카드더미
    ========================== -->

    <div id="deck-area">

        <div id="deck">
            카드더미
        </div>

        <!-- 카드가 무한이므로 ∞ 표시 -->

        <div id="deck-count">
            Click
        </div>

    </div>


    <!-- =========================
         손패
    ========================== -->

    <div id="hand" class="hand"></div>


    <!-- =========================
         게임 시작 화면
    ========================== -->

    <div id="start-screen" class="overlay">

        <h1>
            사과팡
        </h1>

        <button id="start-button">
            게임 시작
        </button>

    </div>


    <!-- =========================
         게임 오버 화면
    ========================== -->

    <div id="game-over" class="overlay hidden">

        <h1>
            게임 종료!
        </h1>

        <div id="final-score">
            최종 점수: 0
        </div>

        <br>

        <button id="restart-button">
            다시하기
        </button>

    </div>


</div>



<script>


    /* =================================================
       게임 기본 설정
    ================================================= */

    /*
        처음 손패는 7장

        그리고 손패가 7장보다 적어지면
        다시 7장까지 자동 보충한다.
    */

    const INITIAL_HAND_SIZE = 7;


    /*
        게임 시간은 30초
    */

    const GAME_TIME = 30;



    /* =================================================
       게임 변수
    ================================================= */

    /*
        이제 실제 카드더미는 존재하지 않는다.

        카드더미를 클릭할 때마다
        1~9 중 랜덤한 숫자를 새로 만든다.

        따라서 카드 수는 사실상 무한이다.
    */

    let hand = [];


    /*
        현재 선택된 카드의 index
    */

    let selectedCards = [];


    /*
        점수
    */

    let score = 0;


    /*
        남은 시간
    */

    let timeLeft = GAME_TIME;


    /*
        타이머
    */

    let timerInterval = null;


    /*
        게임이 시작되었는지 확인
    */

    let gameStarted = false;



    /* =================================================
       HTML 요소 가져오기
    ================================================= */

    const handElement =
        document.getElementById("hand");

    const scoreElement =
        document.getElementById("score");

    const timerElement =
        document.getElementById("timer");

    const deckElement =
        document.getElementById("deck");

    const currentSumElement =
        document.getElementById("current-sum");

    const messageElement =
        document.getElementById("message");

    const startScreen =
        document.getElementById("start-screen");

    const gameOverScreen =
        document.getElementById("game-over");

    const startButton =
        document.getElementById("start-button");

    const restartButton =
        document.getElementById("restart-button");

    const finalScoreElement =
        document.getElementById("final-score");



    /* =================================================
       게임 초기화
    ================================================= */

    function resetGame() {

        /*
            기존 타이머 정지
        */

        clearInterval(timerInterval);


        /*
            게임 데이터 초기화
        */

        hand = [];

        selectedCards = [];

        score = 0;

        timeLeft = GAME_TIME;

        gameStarted = false;


        /*
            화면 초기화
        */

        handElement.innerHTML = "";

        scoreElement.textContent =
            "점수: 0";

        timerElement.textContent =
            "시간: 30";

        timerElement.classList.remove("warning");

        currentSumElement.textContent =
            "선택 합: 0";

        messageElement.textContent = "";

        finalScoreElement.textContent =
            "최종 점수: 0";
    }



    /* =================================================
       랜덤 카드 1장 만들기
    ================================================= */

    function createRandomCard() {

        /*
            1~9 중 랜덤 숫자 생성

            Math.random()
            → 0 이상 1 미만

            × 9
            → 0 이상 9 미만

            Math.floor()
            → 0~8

            + 1
            → 1~9
        */

        return Math.floor(Math.random() * 9) + 1;
    }



    /* =================================================
       랜덤 카드 여러 장 추가
    ================================================= */

    function drawCards(count) {

        for (let i = 0; i < count; i++) {

            /*
                랜덤 카드 1장을 만든다.
            */

            const randomCard =
                createRandomCard();


            /*
                손패에 추가한다.
            */

            hand.push(randomCard);
        }
    }



    /* =================================================
       게임 시작
    ================================================= */

    function startGame() {

        /*
            게임 초기화
        */

        resetGame();


        /*
            게임 시작
        */

        gameStarted = true;


        /*
            시작 화면 숨기기
        */

        startScreen.classList.add("hidden");

        gameOverScreen.classList.add("hidden");


        /*
            처음에 랜덤 카드 7장 지급
        */

        drawCards(INITIAL_HAND_SIZE);


        /*
            화면 표시
        */

        renderHand();

        updateScore();

        startTimer();
    }



    /* =================================================
       카드더미 클릭
    ================================================= */

    function drawOneCard() {

        /*
            게임 중이 아니면 작동하지 않는다.
        */

        if (!gameStarted) return;


        /*
            시간이 끝났으면 작동하지 않는다.
        */

        if (timeLeft <= 0) return;


        /*
            1~9 중 랜덤 카드 생성
        */

        const randomCard =
            createRandomCard();


        /*
            손패에 추가
        */

        hand.push(randomCard);


        /*
            카드더미에서 카드를 뽑았으므로
            점수 -1
        */

        score--;


        /*
            화면 업데이트
        */

        updateScore();

        renderHand();
    }



    /* =================================================
       손패 화면 표시
    ================================================= */

    function renderHand() {

        /*
            기존 카드 화면 삭제
        */

        handElement.innerHTML = "";


        /*
            카드가 많아지면
            카드 사이 간격을 줄인다.
        */

        let gap = 12;


        if (hand.length > 10) {

            gap = 6;
        }


        if (hand.length > 14) {

            gap = 3;
        }


        handElement.style.gap =
            gap + "px";


        /*
            손패에 있는 카드들을 화면에 표시
        */

        hand.forEach((number, index) => {

            const card =
                document.createElement("div");


            card.className = "card";


            card.textContent =
                number;


            /*
                현재 선택된 카드라면
                selected 클래스 추가
            */

            if (selectedCards.includes(index)) {

                card.classList.add("selected");
            }


            /*
                카드를 클릭하면
                selectCard 실행
            */

            card.addEventListener(
                "click",
                function() {

                    selectCard(index);

                }
            );


            handElement.appendChild(card);

        });
    }



    /* =================================================
       카드 선택
    ================================================= */

    function selectCard(index) {

        /*
            게임 중이 아니면 선택 불가
        */

        if (!gameStarted) return;


        /*
            이미 선택된 카드인지 확인
        */

        const selectedIndex =
            selectedCards.indexOf(index);


        /*
            이미 선택되어 있다면
            선택 취소
        */

        if (selectedIndex !== -1) {

            selectedCards.splice(
                selectedIndex,
                1
            );

        }


        /*
            선택되어 있지 않다면
            선택
        */

        else {

            selectedCards.push(index);
        }


        /*
            현재 선택 합 표시
        */

        updateCurrentSum();


        /*
            카드 화면 갱신
        */

        renderHand();


        /*
            합 확인
        */

        checkSelectedCards();
    }



    /* =================================================
       선택된 카드들의 합 계산
    ================================================= */

    function updateCurrentSum() {

        let sum = 0;


        selectedCards.forEach(index => {

            sum += hand[index];

        });


        currentSumElement.textContent =
            "선택 합: " + sum;
    }



    /* =================================================
       선택된 카드가 10인지 확인
    ================================================= */

    function checkSelectedCards() {

        let sum = 0;


        selectedCards.forEach(index => {

            sum += hand[index];

        });


        /*
            합이 정확히 10이면
            카드 제거
        */

        if (sum === 10) {

            removeSelectedCards();

        }


        /*
            합이 10보다 크면
            선택 취소
        */

        else if (sum > 10) {

            messageElement.textContent =
                "합이 10을 넘었습니다!";


            setTimeout(() => {

                selectedCards = [];

                messageElement.textContent = "";

                updateCurrentSum();

                renderHand();

            }, 500);
        }
    }



    /* =================================================
       선택된 카드 제거
    ================================================= */

    function removeSelectedCards() {

        /*
            몇 장을 제거하는지 기억
        */

        const removeCount =
            selectedCards.length;


        /*
            제거한 카드 수만큼
            점수 증가
        */

        score += removeCount;


        /*
            index가 꼬이지 않도록
            큰 index부터 제거
        */

        selectedCards.sort(
            (a, b) => b - a
        );


        /*
            선택된 카드 제거
        */

        selectedCards.forEach(index => {

            hand.splice(index, 1);

        });


        /*
            선택 초기화
        */

        selectedCards = [];


        /*
            =====================================
            핵심 손패 규칙
            =====================================

            손패가 7장보다 적을 때만
            부족한 만큼 자동 보충한다.

            예:

            12장 → 2장 제거 → 10장

            7 - 10 = -3

            부족하지 않으므로
            추가 카드 없음.


            또 다른 예:

            7장 → 2장 제거 → 5장

            7 - 5 = 2

            2장이 부족하므로
            랜덤 카드 2장 추가.

            결과:

            5장 → 7장
        */


        const needCards =
            INITIAL_HAND_SIZE - hand.length;


        if (needCards > 0) {

            drawCards(needCards);
        }


        /*
            화면 업데이트
        */

        updateScore();

        updateCurrentSum();

        renderHand();
    }



    /* =================================================
       점수 업데이트
    ================================================= */

    function updateScore() {

        scoreElement.textContent =
            "점수: " + score;
    }



    /* =================================================
       타이머
    ================================================= */

    function startTimer() {

        /*
            기존 타이머 제거
        */

        clearInterval(timerInterval);


        /*
            1초마다 실행
        */

        timerInterval = setInterval(() => {

            timeLeft--;


            /*
                시간 표시
            */

            timerElement.textContent =
                "시간: " + timeLeft;


            /*
                마지막 5초
            */

            if (timeLeft <= 5) {

                timerElement.classList.add(
                    "warning"
                );
            }


            /*
                시간이 0이면 게임 종료
            */

            if (timeLeft <= 0) {

                clearInterval(timerInterval);

                endGame();

            }

        }, 1000);
    }



    /* =================================================
       게임 종료
    ================================================= */

    function endGame() {

        /*
            게임 중지
        */

        gameStarted = false;


        /*
            타이머 정지
        */

        clearInterval(timerInterval);


        /*
            최종 점수 표시
        */

        finalScoreElement.textContent =
            "최종 점수: " + score;


        /*
            게임 오버 화면 표시
        */

        gameOverScreen.classList.remove(
            "hidden"
        );
    }



    /* =================================================
       다시하기
    ================================================= */

    function restartGame() {

        /*
            게임을 완전히 초기화
        */

        resetGame();


        /*
            게임 시작
        */

        gameStarted = true;


        /*
            화면 설정
        */

        startScreen.classList.add("hidden");

        gameOverScreen.classList.add("hidden");


        /*
            새로운 랜덤 카드 7장 생성
        */

        drawCards(INITIAL_HAND_SIZE);


        /*
            화면 표시
        */

        renderHand();

        updateScore();

        startTimer();
    }



    /* =================================================
       버튼 이벤트
    ================================================= */

    /*
        게임 시작 버튼
    */

    startButton.addEventListener(
        "click",
        startGame
    );


    /*
        다시하기 버튼
    */

    restartButton.addEventListener(
        "click",
        restartGame
    );


    /*
        카드더미 클릭
    */

    deckElement.addEventListener(
        "click",
        drawOneCard
    );

</script>


</body>
</html>
```
